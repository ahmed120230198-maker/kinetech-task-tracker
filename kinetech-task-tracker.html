<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KineTech · Task Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --purple:#6C4A9C; --purple-dark:#2E2145; --purple-deep:#221934; --purple-light:#F1ECF9;
  --teal:#4FB8CC; --teal-dark:#2E8FA3; --teal-light:#E9F8FA;
  --gray:#9C97A6; --gray-light:#ECEAF1; --ink:#241B33; --bg:#F7F5FB;
  --danger:#C0553F; --warning:#C98A22; --success:#3F8F5C;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0}
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(200deg,var(--purple-dark),var(--purple-deep));color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 16px}
.brand h1{font-size:17px;font-weight:700}
.brand .sub{font-size:10.5px;color:#ffffff90;letter-spacing:.03em;margin-top:1px}
.nav{padding:8px 10px;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:3px;border:none;background:transparent;color:#ffffffb0;font-family:'Inter';font-size:13.5px;font-weight:500;border-radius:9px;cursor:pointer;text-align:left;transition:.15s}
.nav button:hover{background:#ffffff10;color:#fff}
.nav button.active{background:linear-gradient(90deg,var(--purple),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.nav svg{flex-shrink:0}
.sidebar-foot{padding:14px 20px;font-size:11px;color:#ffffff70;border-top:1px solid #ffffff1a}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;box-shadow:0 0 6px var(--teal)}
/* Main */
.main{flex:1;padding:26px 30px;max-width:1300px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.topbar h2{font-size:21px;color:var(--purple-dark)}
.topbar p{margin:2px 0 0;font-size:13px;color:var(--gray)}
/* Cards / panels */
.panel{background:#fff;border:1px solid var(--gray-light);border-radius:14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(40,20,70,.04)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--gray-light)}
.panel-head h3{font-size:14px;color:var(--purple-dark);display:flex;align-items:center;gap:8px}
.panel-body{padding:18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.w-full{grid-column:span 6}.w-half{grid-column:span 3}.w-third{grid-column:span 2}
@media(max-width:720px){.grid{grid-template-columns:1fr}.w-full,.w-half,.w-third{grid-column:span 1}.sidebar{width:72px}.brand h1,.brand .sub,.nav button span{display:none}.nav button{justify-content:center}}
label{display:block;font-size:12px;font-weight:600;color:#5b5268;margin-bottom:5px}
input,select,textarea{width:100%;border:1.5px solid var(--gray-light);border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:'Inter';color:var(--ink);background:#fff;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px #6c4a9c22}
textarea{min-height:64px;resize:vertical}
input[type=range]{accent-color:var(--teal)}
.req{color:var(--danger)}
/* Buttons */
.btn{border:none;cursor:pointer;font-family:'Inter';font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:9px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--purple),#8465b8);color:#fff;box-shadow:0 3px 10px #6c4a9c40}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 14px #6c4a9c55}
.btn-teal{background:#fff;color:var(--teal-dark);border:1.5px solid var(--teal)}
.btn-teal:hover{background:var(--teal-light)}
.btn-ghost{background:#fff;border:1.5px solid var(--gray-light);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:12px}
/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--purple-dark);text-transform:uppercase;letter-spacing:.03em;padding:9px 8px;border-bottom:2px solid var(--purple-light)}
td{padding:9px 8px;border-bottom:1px solid var(--gray-light);vertical-align:top}
tr.row:hover{background:var(--purple-light);cursor:pointer}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.progress{width:80px;height:7px;background:var(--gray-light);border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark))}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--purple);margin-right:2px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--gray-light);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--purple))}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg,#6c4a9c1c);color:var(--accent,var(--purple));flex-shrink:0}
.kpi .lbl{font-size:11.5px;color:var(--gray)}
.kpi .val{font-size:19px;font-weight:700;color:var(--ink)}
/* charts row */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart-box{position:relative;height:230px}
/* Toast / modal */
#toast{position:fixed;bottom:22px;right:22px;padding:12px 18px;border-radius:10px;color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:999;display:none;align-items:center;gap:8px}
#overlay{position:fixed;inset:0;background:#1b1130aa;display:none;align-items:center;justify-content:center;z-index:998}
#overlay .box{background:#fff;border-radius:14px;padding:22px;max-width:380px;margin:0 16px}
.errbox{background:#fbeee9;border:1px solid #c0553f55;color:var(--danger);padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px}
.insight{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin-bottom:7px}
.insight .b{width:7px;height:7px;border-radius:50%;background:var(--teal);margin-top:6px;flex-shrink:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select,.filters input[type=text]{width:auto}
.searchwrap{position:relative;flex:1;min-width:220px}
.searchwrap svg{position:absolute;left:10px;top:11px}
.searchwrap input{padding-left:32px}
.hint{font-size:12px;color:var(--gray);margin-top:8px;line-height:1.5}
code.tag{background:var(--purple-light);color:var(--purple-dark);padding:1px 6px;border-radius:5px;font-size:12px}
.copybox{width:100%;height:230px;font-family:monospace;font-size:11.5px;background:#221934;color:#c9c3dc;border:none;border-radius:10px;padding:14px}
@media print{.no-print{display:none!important}#reportArea{display:block!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar no-print">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#9C97A6" stroke-width="4"/><line x1="46" y1="12" x2="46" y2="88" stroke="#8f6fc4" stroke-width="5"/><line x1="55" y1="30" x2="55" y2="70" stroke="#8f6fc4" stroke-width="5"/><circle cx="27" cy="50" r="8" fill="#8f6fc4"/><path d="M27 42 L18 32 M27 58 L18 68 M19 50 L10 50" stroke="#8f6fc4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="18" cy="32" r="3.5" fill="#2E2145" stroke="#8f6fc4" stroke-width="3"/><circle cx="18" cy="68" r="3.5" fill="#2E2145" stroke="#8f6fc4" stroke-width="3"/><circle cx="10" cy="50" r="3.5" fill="#2E2145" stroke="#8f6fc4" stroke-width="3"/><path d="M62 20 C78 22 88 40 82 55 C88 62 80 74 70 72 C68 82 52 82 50 72 L50 22 C54 18 58 18 62 20 Z" fill="#4FB8CC"/></svg>
      <div><h1><span style="color:#fff">Kine</span><span style="color:#4FB8CC">Tech</span></h1><div class="sub">TASK TRACKER</div></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot"><span class="dot"></span><span id="recCount">0</span> records stored</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h2 id="pageTitle"></h2><p id="pageSub"></p></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="overlay"><div class="box"><p id="confirmMsg" style="font-size:13.5px;margin:0 0 16px"></p>
  <div style="display:flex;justify-content:flex-end;gap:8px">
    <button class="btn btn-ghost btn-sm" onclick="closeConfirm()">Cancel</button>
    <button class="btn btn-danger btn-sm" id="confirmYes">Confirm</button>
  </div></div></div>
<div id="toast"></div>

<script>
/* ---------------- Icons ---------------- */
const ICONS = {
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  chart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>',
  doc:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>',
  db:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  users:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 8a4 4 0 010 8M23 21c0-3-2-5-4-5.5"/></svg>',
  clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  filter:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16l-6 8v6l-4 2v-8z"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
  alert:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
  award:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M8.2 13.5L7 22l5-3 5 3-1.2-8.5"/></svg>',
  download:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>',
  link:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>',
  print:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>',
  zap:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h8l-1 8 10-12h-8z"/></svg>'
};

/* ---------------- Config / Field schema ---------------- */
const DEPT_OPT=["Operations","Engineering","Sales","Marketing","Finance","HR","Customer Support","Logistics","IT","Quality Control"];
const JOB_OPT=["Associate","Specialist","Senior Specialist","Team Lead","Supervisor","Manager","Analyst","Coordinator"];
const CAT_OPT=["Project","Routine","Ad-hoc","Training","Compliance"];
const GENDERS=["Male","Female","Other","Prefer not to say"];
const STATUSES=["Not Started","In Progress","Completed","On Hold","Cancelled"];
const PRIORITIES=["Low","Medium","High","Urgent"];
const STATUS_COLOR={"Not Started":"#9C97A6","In Progress":"#4FB8CC","Completed":"#3F8F5C","On Hold":"#C98A22","Cancelled":"#C0553F"};
const PRIORITY_COLOR={"Low":"#9C97A6","Medium":"#6C4A9C","High":"#C98A22","Urgent":"#C0553F"};

const FIELD_GROUPS=[
 {title:"Employee Information",icon:"users",fields:[
  {k:"employeeId",l:"Employee ID",t:"text",req:1,w:"half"},
  {k:"firstName",l:"First Name",t:"text",req:1,w:"half"},
  {k:"lastName",l:"Last Name",t:"text",req:1,w:"half"},
  {k:"gender",l:"Gender",t:"select",o:GENDERS,w:"half"},
  {k:"age",l:"Age",t:"number",w:"third"},
  {k:"phone",l:"Phone Number",t:"text",w:"third"},
  {k:"employeeEmail",l:"Employee Email",t:"text",w:"third"},
  {k:"jobTitle",l:"Job Title",t:"list",o:JOB_OPT,w:"half"},
  {k:"department",l:"Department",t:"list",o:DEPT_OPT,w:"half"},
  {k:"branch",l:"Branch / Location",t:"text",w:"half"},
  {k:"supervisor",l:"Supervisor / Deliver To",t:"text",w:"half"},
 ]},
 {title:"Task Details",icon:"doc",fields:[
  {k:"taskId",l:"Task ID",t:"text",req:1,w:"half"},
  {k:"taskName",l:"Task Name",t:"text",req:1,w:"half"},
  {k:"taskCategory",l:"Task Category",t:"list",o:CAT_OPT,w:"half"},
  {k:"taskDescription",l:"Task Description",t:"textarea",w:"full"},
 ]},
 {title:"Schedule & Priority",icon:"clock",fields:[
  {k:"entryDate",l:"Entry Date",t:"date",w:"third"},
  {k:"assignedDate",l:"Assigned Date",t:"date",w:"third"},
  {k:"deadline",l:"Deadline",t:"date",w:"third"},
  {k:"priority",l:"Priority",t:"select",o:PRIORITIES,w:"half"},
  {k:"estimatedHours",l:"Estimated Hours",t:"number",w:"half"},
 ]},
 {title:"Status & Performance",icon:"chart",fields:[
  {k:"taskStatus",l:"Task Status",t:"select",o:STATUSES,w:"half"},
  {k:"completionDate",l:"Completion Date",t:"date",w:"half"},
  {k:"progress",l:"Progress (%)",t:"range",w:"full"},
  {k:"actualHours",l:"Actual Hours",t:"number",w:"half"},
  {k:"performanceRating",l:"Performance Rating (1-5)",t:"rating",w:"half"},
 ]},
 {title:"Delays & Follow-up",icon:"alert",fields:[
  {k:"delayed",l:"Delayed?",t:"select",o:["No","Yes"],w:"third"},
  {k:"delayDays",l:"Delay (days)",t:"number",w:"third"},
  {k:"delayReason",l:"Reason for Delay",t:"textarea",w:"full"},
  {k:"excuse",l:"Excuse Given",t:"textarea",w:"full"},
  {k:"trainingNeeds",l:"Training Needs / Taken",t:"textarea",w:"full"},
  {k:"requiredAction",l:"Required Action",t:"textarea",w:"full"},
 ]},
 {title:"HR Notes",icon:"edit",fields:[
  {k:"hrName",l:"HR Name (entered by)",t:"text",req:1,w:"half"},
  {k:"hrComment",l:"HR Comment",t:"textarea",w:"full"},
 ]},
];
const ALL_FIELDS=FIELD_GROUPS.flatMap(g=>g.fields);

/* ---------------- State ---------------- */
let RECORDS = JSON.parse(localStorage.getItem('kinetech_records')||'[]');
let editingId = null;
let currentView = 'entry';
let charts = {};

function uid(){return 'REC-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(d){ if(!d) return '—'; try{return new Date(d+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(e){return d;} }
function avg(a){return a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;}
function pctOf(a,b){return b? Math.round(a/b*100):0;}
function countBy(arr,key){const m={};arr.forEach(r=>{const v=r[key]||'Unspecified';m[v]=(m[v]||0)+1;});return m;}
function topKey(m){const e=Object.entries(m).filter(x=>x[0]!=='Unspecified');if(!e.length)return null;return e.sort((a,b)=>b[1]-a[1])[0][0];}
function persist(){localStorage.setItem('kinetech_records',JSON.stringify(RECORDS));document.getElementById('recCount').textContent=RECORDS.length;}

function getPeriodRange(preset, refStr){
  const ref = refStr? new Date(refStr+'T00:00:00') : new Date();
  let start,end;
  if(preset==='week'){const d=ref.getDay();start=new Date(ref);start.setDate(ref.getDate()-d);end=new Date(start);end.setDate(start.getDate()+6);}
  else if(preset==='month'){start=new Date(ref.getFullYear(),ref.getMonth(),1);end=new Date(ref.getFullYear(),ref.getMonth()+1,0);}
  else if(preset==='quarter'){const q=Math.floor(ref.getMonth()/3);start=new Date(ref.getFullYear(),q*3,1);end=new Date(ref.getFullYear(),q*3+3,0);}
  else if(preset==='year'){start=new Date(ref.getFullYear(),0,1);end=new Date(ref.getFullYear(),11,31);}
  else return {start:null,end:null};
  start.setHours(0,0,0,0);end.setHours(23,59,59,999);
  return {start,end};
}
function inRange(dateStr,start,end){ if(!start||!end) return true; if(!dateStr) return false; const d=new Date(dateStr+'T12:00:00'); return d>=start&&d<=end; }

/* ---------------- Toast / confirm ---------------- */
function notify(msg,type){
  const t=document.getElementById('toast');
  t.style.background = type==='error' ? '#C0553F' : '#3F8F5C';
  t.innerHTML = (type==='error'?ICONS.alert:ICONS.check)+'<span>'+msg+'</span>';
  t.style.display='flex';
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.display='none',3000);
}
function askConfirm(msg,onYes){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('overlay').style.display='flex';
  document.getElementById('confirmYes').onclick=()=>{closeConfirm();onYes();};
}
function closeConfirm(){document.getElementById('overlay').style.display='none';}

/* ---------------- Field rendering ---------------- */
function fieldHTML(f){
  const id='fld_'+f.k;
  let inner='';
  if(f.t==='select'){
    inner=`<select id="${id}"><option value="">Select…</option>${f.o.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>`;
  } else if(f.t==='list'){
    inner=`<input list="${id}_dl" id="${id}" placeholder="Type or choose…"><datalist id="${id}_dl">${f.o.map(o=>`<option value="${o}">`).join('')}</datalist>`;
  } else if(f.t==='textarea'){
    inner=`<textarea id="${id}"></textarea>`;
  } else if(f.t==='range'){
    inner=`<div style="display:flex;gap:12px;align-items:center"><input type="range" min="0" max="100" id="${id}" oninput="document.getElementById('${id}_n').value=this.value" style="flex:1"><input type="number" min="0" max="100" id="${id}_n" style="width:70px" oninput="document.getElementById('${id}').value=this.value" value="0"></div>`;
  } else if(f.t==='rating'){
    inner=`<div class="dots" id="${id}_wrap">`+[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="setRating('${id}',${n})" style="cursor:pointer"></span>`).join('')+`</div><input type="hidden" id="${id}" value="">`;
  } else {
    inner=`<input type="${f.t}" id="${id}">`;
  }
  return `<div class="${f.w==='half'?'w-half':f.w==='third'?'w-third':'w-full'}"><label>${f.l}${f.req?'<span class="req"> *</span>':''}</label>${inner}</div>`;
}
function setRating(id,n){
  document.getElementById(id).value=n;
  const wrap=document.getElementById(id+'_wrap');
  [...wrap.children].forEach((s,i)=>{ s.style.background = (i<n)?'#6C4A9C':'#fff'; });
}
function getRatingVal(id){ return document.getElementById(id) ? document.getElementById(id).value : ''; }

function renderEntryForm(){
  let html = editingId ? `<div class="panel" style="border-color:#4FB8CC55"><div class="panel-body" style="display:flex;justify-content:space-between;align-items:center;background:#E9F8FA;border-radius:14px">
    <span style="font-size:13.5px;color:#2E8FA3">Editing record <strong>${editingId}</strong></span>
    <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">Cancel edit</button></div></div>` : '';
  html += `<div id="formErrors"></div>`;
  FIELD_GROUPS.forEach(g=>{
    html += `<div class="panel"><div class="panel-head"><h3>${ICONS[g.icon]||''} ${g.title}</h3></div><div class="panel-body"><div class="grid">${g.fields.map(fieldHTML).join('')}</div></div></div>`;
  });
  html += `<div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:30px">
    ${editingId?'<button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>':''}
    <button class="btn btn-primary" onclick="submitForm()">${ICONS.plus} ${editingId?'Save Changes':'Add Task Record'}</button>
  </div>`;
  document.getElementById('view').innerHTML = html;
  if(editingId){ fillForm(RECORDS.find(r=>r.id===editingId)); }
}
function fillForm(rec){
  ALL_FIELDS.forEach(f=>{
    const el=document.getElementById('fld_'+f.k);
    if(!el) return;
    const val = rec[f.k]||'';
    if(f.t==='range'){ el.value=val||0; document.getElementById('fld_'+f.k+'_n').value=val||0; }
    else if(f.t==='rating'){ el.value=val||''; setRating('fld_'+f.k,Number(val)||0); }
    else el.value=val;
  });
}
function readForm(){
  const rec={};
  ALL_FIELDS.forEach(f=>{
    if(f.t==='rating'){ rec[f.k]=getRatingVal('fld_'+f.k); }
    else { const el=document.getElementById('fld_'+f.k); rec[f.k]=el?el.value.trim():''; }
  });
  return rec;
}
function clearForm(){
  editingId=null; renderEntryForm();
}
function cancelEdit(){ editingId=null; renderEntryForm(); }

function submitForm(){
  const rec = readForm();
  const errs=[];
  ALL_FIELDS.forEach(f=>{ if(f.req && !rec[f.k]) errs.push(f.l+' is required'); });
  if(errs.length){ document.getElementById('formErrors').innerHTML = `<div class="errbox">${ICONS.alert} ${errs.join(' · ')}</div>`; return; }
  document.getElementById('formErrors').innerHTML='';
  const dup = RECORDS.find(r=>r.id!==editingId && r.employeeId===rec.employeeId && r.taskId===rec.taskId);
  if(dup && !editingId){
    askConfirm(`A record already exists for employee ${rec.employeeId} on task ${rec.taskId} (${dup.taskName}). Update that record instead of creating a duplicate?`, ()=>saveRecord(rec,dup.id));
    return;
  }
  saveRecord(rec, editingId);
}
function saveRecord(rec,id){
  const now=new Date().toISOString();
  if(id){
    RECORDS = RECORDS.map(r=>r.id===id?{...r,...rec,updatedAt:now}:r);
    notify('Record updated & sent to spreadsheet');
    pushToSheet({...rec,id});
  } else {
    const full = {...rec,id:uid(),createdAt:now,updatedAt:now};
    RECORDS.push(full);
    notify('Task saved & sent to spreadsheet');
    pushToSheet(full);
  }
  persist();
  editingId=null;
  renderEntryForm();
}

/* ---------------- Google Sheets push ---------------- */
function pushToSheet(rec){
  const url = localStorage.getItem('kinetech_appscript_url');
  if(!url){ return; } // silently skip if not configured; export tab covers fallback
  const payload={};
  ALL_FIELDS.forEach(f=>payload[f.l]=rec[f.k]||'');
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}).catch(()=>{});
}

function renderRecordsTable(){
  const q=(document.getElementById('rsQ')?.value||'').toLowerCase();
  const dept=document.getElementById('rsDept')?.value||'';
  const status=document.getElementById('rsStatus')?.value||'';
  const prio=document.getElementById('rsPriority')?.value||'';
  const delayedOnly=document.getElementById('rsDelayed')?.checked;
  let list = RECORDS.filter(r=>{
    if(dept && r.department!==dept) return false;
    if(status && r.taskStatus!==status) return false;
    if(prio && r.priority!==prio) return false;
    if(delayedOnly && r.delayed!=='Yes') return false;
    if(!q) return true;
    return ALL_FIELDS.some(f=>String(r[f.k]||'').toLowerCase().includes(q));
  }).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  document.getElementById('rsCount').textContent = list.length+' of '+RECORDS.length+' records';
  const body=document.getElementById('rsBody');
  if(!list.length){ body.innerHTML=`<tr><td colspan="9" style="text-align:center;color:var(--gray);padding:30px">No matching records.</td></tr>`; return; }

/* ---------------- Dashboard ---------------- */
function computeStats(recs){
  const total=recs.length;
  const completed=recs.filter(r=>r.taskStatus==='Completed').length;
  const delayed=recs.filter(r=>r.delayed==='Yes').length;
  const avgRating=avg(recs.map(r=>Number(r.performanceRating)).filter(Boolean));
  const avgProgress=avg(recs.map(r=>Number(r.progress)||0));
  const statusCounts=countBy(recs,'taskStatus');
  const priorityCounts=countBy(recs,'priority');
  const deptCounts=countBy(recs,'department');
  const delayReasonCounts=countBy(recs.filter(r=>r.delayed==='Yes'),'delayReason');
  const trendMap={};
  recs.forEach(r=>{ if(!r.assignedDate) return; const m=r.assignedDate.slice(0,7); if(!trendMap[m]) trendMap[m]={sum:0,n:0}; if(r.performanceRating){trendMap[m].sum+=Number(r.performanceRating);trendMap[m].n++;} });
  const trendLabels=Object.keys(trendMap).sort();
  const trendData=trendLabels.map(m=>trendMap[m].n? +(trendMap[m].sum/trendMap[m].n).toFixed(2):0);
  return {total,completed,delayed,avgRating,avgProgress,statusCounts,priorityCounts,deptCounts,delayReasonCounts,trendLabels,trendData};
}

  const s=computeStats(scoped);
  document.getElementById('dbKpis').innerHTML = `
    ${kpi(ICONS.doc,'Total Tasks',s.total,'#6C4A9C','#6c4a9c1c')}

    ${kpi(ICONS.award,'Avg. Performance', s.avgRating? s.avgRating.toFixed(1)+' / 5':'—','#4FB8CC','#4fb8cc1c')}`;

}
function kpi(icon,label,val,accent,bg){ return `<div class="kpi" style="--accent:${accent};--accent-bg:${bg}"><div class="ic">${icon}</div><div><div class="lbl">${label}</div><div class="val">${val}</div></div></div>`; }
function chartPanel(id,title){ return `<div class="panel"><div class="panel-head"><h3>${title}</h3></div><div class="panel-body"><div class="chart-box"><canvas id="${id}"></canvas></div></div></div>`; }
function drawDoughnut(id,counts,colorMap){
  const labels=Object.keys(counts);
  return new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data:Object.values(counts),backgroundColor:labels.map(l=>colorMap[l]||'#9C97A6')}]},options:{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},cutout:'55%'}});
}
function drawBar(id,counts,colorMap,solid){
  const labels=Object.keys(counts);
  return new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:Object.values(counts),backgroundColor:labels.map(l=>colorMap?colorMap[l]||'#6C4A9C':solid),borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
}
function drawLine(id,labels,data){
  return new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{data,borderColor:'#4FB8CC',backgroundColor:'#4fb8cc33',fill:true,tension:.35,pointBackgroundColor:'#2E8FA3'}]},options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:5}}}});
}

/* ---------------- Reports ---------------- */
function buildInsights(scoped){
  const total=scoped.length;
  if(!total) return ['No task records fall within the selected period and scope.'];
  const s=computeStats(scoped);
  const out=[];
  out.push(`${s.completed} of ${total} tasks (${pctOf(s.completed,total)}%) were completed in this period.`);
  if(s.delayed>0){ const tr=topKey(s.delayReasonCounts); out.push(`${s.delayed} task(s) (${pctOf(s.delayed,total)}%) were delayed${tr?`, most commonly due to "${tr}"`:''}.`); }
  else out.push('No delays were recorded in this period — a clean delivery record.');
  out.push(`Average performance rating was ${s.avgRating? s.avgRating.toFixed(1):'—'} / 5, with average progress at ${Math.round(s.avgProgress)}%.`);
  const td=topKey(s.deptCounts); if(td) out.push(`${td} carried the highest task volume this period.`);
  const urgent=scoped.filter(r=>r.priority==='Urgent').length; if(urgent>0) out.push(`${urgent} task(s) were marked Urgent — confirm these were prioritized accordingly.`);
  const training=scoped.filter(r=>r.trainingNeeds&&r.trainingNeeds.trim()).length; if(training>0) out.push(`${training} record(s) flagged a training need — worth a development-plan review.`);
  return out;
}

  </div></div>`;
}
function saveAppscriptUrl(){ const v=document.getElementById('appscriptUrl').value.trim(); localStorage.setItem('kinetech_appscript_url',v); notify('Google Sheets URL saved.'); }
function testSync(){
  const url=document.getElementById('appscriptUrl').value.trim();
  if(!url){ notify('Paste your Apps Script URL first.','error'); return; }
  const payload={}; ALL_FIELDS.forEach(f=>payload[f.l]='TEST');
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
    .then(()=>notify('Test sent — check your spreadsheet for a new "TEST" row.'))
    .catch(()=>notify('Could not reach that URL.','error'));
}
function copyScript(){ navigator.clipboard.writeText(APPSCRIPT_CODE).then(()=>notify('Script copied to clipboard.')); }
function exportXLSX(){
  try{
    const rows=RECORDS.map(r=>Object.fromEntries(ALL_FIELDS.map(f=>[f.l,r[f.k]||''])));
    const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'KineTech Tasks'); XLSX.writeFile(wb,`KineTech_Task_Records_${today()}.xlsx`);
    notify('Excel file downloaded.');
  }catch(e){ notify('Export failed.','error'); }
}
function exportCSV(){
  try{
    const headers=ALL_FIELDS.map(f=>f.l);
    const lines=[headers.join(',')];
    RECORDS.forEach(r=>lines.push(ALL_FIELDS.map(f=>`"${String(r[f.k]||'').replace(/"/g,'""')}"`).join(',')));
    const blob=new Blob([lines.join('\n')],{type:'text/csv'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`KineTech_Task_Records_${today()}.csv`; a.click(); URL.revokeObjectURL(url);
    notify('CSV file downloaded.');
  }catch(e){ notify('Export failed.','error'); }
}

/* ---------------- Nav / Router ---------------- */
const NAV=[
 {k:'entry',l:'Data Entry',icon:'plus',sub:'Log a new task or performance update'},
 {k:'records',l:'Records & Search',icon:'search',sub:'Find, review and edit any record'},
 {k:'dashboard',l:'Dashboard',icon:'chart',sub:'Live KPIs for one employee or the whole team'},
 {k:'reports',l:'Reports',icon:'doc',sub:'Printable weekly / monthly / quarterly / annual summaries'},
 {k:'sheet',l:'Spreadsheet Access',icon:'db',sub:'Connect and export to Google Sheets'},
];
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=>`<button class="${n.k===currentView?'active':''}" onclick="navigate('${n.k}')">${ICONS[n.icon]}<span>${n.l}</span></button>`).join('');
}
function navigate(v){
  currentView=v; renderNav();
  const meta=NAV.find(n=>n.k===v);
  document.getElementById('pageTitle').textContent=meta.l;
  document.getElementById('pageSub').textContent=meta.sub;
  if(v==='entry') renderEntryForm();
  else if(v==='records') renderRecordsView();
  else if(v==='dashboard') renderDashboard();
  else if(v==='reports') renderReports();
  else if(v==='sheet') renderSheetView();
}

/* ---------------- Init ---------------- */
document.getElementById('recCount').textContent = RECORDS.length;
navigate('entry');
</script>
